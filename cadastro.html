<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Evangeliza Chorozinho</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

    <!-- CABEÇALHO -->

    <header>

        <div class="container">

            <div class="logo">
                EVANGELIZA CHOROZINHO
            </div>

            <a
                href="index.html"
                class="btn btn-outline">

                INÍCIO

            </a>

        </div>

    </header>


    <!-- CONTEÚDO -->

    <main>

        <section class="about">

            <div class="container">

                <h1>
                    QUERO PARTICIPAR
                </h1>

                <p>
                    Faça seu cadastro para participar
                    do movimento Evangeliza Chorozinho.
                </p>


                <!-- FORMULÁRIO -->

                <form
                    id="formCadastro"
                    class="formulario">


                    <!-- NOME -->

                    <h2 class="form-titulo">
                        Seus dados
                    </h2>


                    <div class="campo">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            required
                            placeholder="Digite seu nome completo">

                    </div>


                    <!-- WHATSAPP -->

                    <div class="campo">

                        <label for="whatsapp">
                            WhatsApp
                        </label>

                        <input
                            type="tel"
                            id="whatsapp"
                            name="whatsapp"
                            required
                            placeholder="(85) 99999-9999">

                    </div>


                    <!-- CIDADE -->

                    <div class="campo">

                        <label for="cidade">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            required
                            placeholder="Digite sua cidade">

                    </div>


                    <!-- BAIRRO -->

                    <div class="campo">

                        <label for="bairro">
                            Bairro
                        </label>

                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            required
                            placeholder="Digite seu bairro">

                    </div>


                    <!-- DENOMINAÇÃO -->

                    <div class="campo">

                        <label for="denominacao">
                            Denominação
                        </label>

                        <input
                            type="text"
                            id="denominacao"
                            name="denominacao"
                            required
                            placeholder="Nome da sua denominação">

                    </div>


                    <!-- IGREJA -->

                    <div class="campo">

                        <label for="igreja">
                            Nome da igreja
                        </label>

                        <input
                            type="text"
                            id="igreja"
                            name="igreja"
                            required
                            placeholder="Nome da sua igreja">

                    </div>


                    <!-- LÍDER -->

                    <div class="campo">

                        <label for="lider">
                            Pastor ou líder responsável
                        </label>

                        <input
                            type="text"
                            id="lider"
                            name="lider"
                            required
                            placeholder="Nome do pastor ou líder">

                    </div>


                    <!-- CARGO -->

                    <div class="campo">

                        <label for="cargo">
                            Cargo que ocupa na igreja
                        </label>

                        <select
                            id="cargo"
                            name="cargo"
                            required>

                            <option value="">
                                Selecione uma opção
                            </option>

                            <option value="Membro(a)">
                                Membro(a)
                            </option>

                            <option value="Cooperador(a)">
                                Cooperador(a)
                            </option>

                            <option value="Obreiro(a)">
                                Obreiro(a)
                            </option>

                            <option value="Diácono/Diaconisa">
                                Diácono/Diaconisa
                            </option>

                            <option value="Presbítero(a)">
                                Presbítero(a)
                            </option>

                            <option value="Evangelista">
                                Evangelista
                            </option>

                            <option value="Pastor(a)">
                                Pastor(a)
                            </option>

                        </select>

                    </div>


                    <!-- ÁREA -->

                    <div class="campo">

                        <label for="area">
                            Área em que deseja servir
                        </label>

                        <select
                            id="area"
                            name="area"
                            required>

                            <option value="">
                                Selecione uma área
                            </option>

                            <option value="Evangelismo">
                                Evangelismo
                            </option>

                            <option value="Intercessão">
                                Intercessão
                            </option>

                            <option value="Louvor">
                                Louvor
                            </option>

                            <option value="Mídia">
                                Mídia
                            </option>

                            <option value="Apoio geral">
                                Apoio geral
                            </option>

                        </select>

                    </div>


                    <!-- OBSERVAÇÃO -->

                    <h2 class="form-titulo">
                        Observação
                    </h2>


                    <div class="campo">

                        <label for="observacao">
                            Alguma informação adicional?
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="5"
                            placeholder="Escreva aqui, se desejar."></textarea>

                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-main">

                        FINALIZAR CADASTRO

                    </button>


                </form>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->

    <footer>

        <div class="container">

            <div class="footer-logo">
                EVANGELIZA CHOROZINHO
            </div>

            <p>
                Um movimento de fé, unidade e evangelização.
            </p>

            <p class="copyright">
                © 2026 Evangeliza Chorozinho
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/cadastro.js"></script>

</body>

</html>
